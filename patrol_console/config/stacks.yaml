# 网页可启停的进程白名单：网页只能按名字启停这里列出的命令，不能传自定义命令。
# 命令在 foxy-live 容器里执行（控制台进程也在容器里）。
#
# ⚠️ 这里只有"纯建图"的 Point-LIO。巡检/导航全套栈（LIO+定位+规划+speed_adapter，
#    以及配套的看门狗、已知起点等安全件）不要从这里启动，继续用 live_stack_start.sh：
#    一键脚本带看门狗等安全配套；从这里起全套会漏掉这些件，而且和一键脚本互相不知道
#    对方在跑，容易双开 LIO（页面上的"话题有多个发布者"警告会提示这一点）。
point_lio:
  label: {zh: Point-LIO 建图, en: Point-LIO mapping}
  description: {zh: 只启动激光惯性里程计，采集新地图用；停止时自动把地图落到 /tmp, en: LIO only, for capturing a new map; stopping it writes the map to /tmp}
  cmd:
    - /home/mu/foxy_ws/install_x86/point_lio_ros2/lib/point_lio_ros2/point_lio_node
    - --ros-args
    - -p
    - config_file:=/home/mu/workspace/Point-LIO/config/mid360.yaml
    - -p
    - map_save_path:=/tmp
  stop_timeout: 15      # SIGINT 后等这么久再 SIGTERM：给退出存图（写 PCD）留时间
  stop_on_estop: false  # 急停不停 LIO（停了就没定位了）
